name: Shade browser smoke
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Chromium browser tools
        run: |
          python -m pip install "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: Generate orthographic Wibble/Cylinder review sheets
        run: node tests/wibble-laterals.cjs
      - name: Exercise five-step Shade workflow
        run: python tests/browser_shade.py
      - name: Upload 2D family-review previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shade-family-profiles
          path: artifacts/shade/
          if-no-files-found: ignore
