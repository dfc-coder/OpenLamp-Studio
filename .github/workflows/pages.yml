name: Publicar demo en GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validar y preparar sitio estático
    runs-on: ubuntu-latest
    steps:
      - name: Obtener develop
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar sintaxis del generador
        run: |
          node --check app.js
          node --check compatibility.js
          node --check wizard.js
          node --check shade-design.js
          node --check shade-editor.js
          node --check basic-shade.js
          node --check mount-adapters.js
          node --check basic-options.js

      - name: Verificar mallas, STL y compatibilidad
        run: |
          node tests/verify.cjs
          node tests/taller_top.cjs
          node tests/original_top.cjs
          node tests/parametric_original.cjs
          node tests/shade-design.cjs
          node tests/shade-mesh.cjs
          node tests/basic-shade.cjs
          node tests/mount-adapters.cjs
          node tests/hidden-socket.cjs
          node tests/morphological-contact.cjs
          node tests/wibble-laterals.cjs
          node tests/compatibility.cjs
          node tests/stand.cjs
          node tests/taller_base.cjs
          node tests/assembly.cjs
          node tests/export.cjs

      - name: Instalar OpenSCAD (validación CAD independiente)
        run: |
          if ! command -v openscad >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq openscad
          fi
      - name: Verificar 15 STL con OpenSCAD CGAL
        timeout-minutes: 12
        env:
          OPENLAMP_CAD_DIR: artifacts/cad
          QT_QPA_PLATFORM: offscreen
        run: node tests/openscad-validate.cjs
      - name: Conservar STL y reporte de auditoría CAD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openscad-mesh-audit-${{ github.run_id }}
          path: |
            artifacts/cad/*.stl
            artifacts/cad/cad-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Empaquetar exclusivamente la aplicación
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets/stands _site/assets/shades
          cp index.html app.js styles.css compatibility.js wizard.js workflow.css shade-design.js shade-editor.js shade-editor.css basic-shade.js basic-options.js basic-shade.css mount-adapters.js CREDITOS.md _site/
          cp assets/stands/wibble-stand.olmesh.gz _site/assets/stands/
          cp assets/stands/wibble-reference.webp _site/assets/stands/
          cp assets/stands/taller-stand.olmesh.gz _site/assets/stands/
          cp assets/stands/taller-stand-reference.png _site/assets/stands/
          cp assets/shades/tallertop-original.olmesh.gz.part-* _site/assets/shades/
          touch _site/.nojekyll

      - name: Verificar archivos de publicación
        run: |
          test -s _site/CREDITOS.md
          test -s _site/index.html
          test -s _site/compatibility.js
          test -s _site/wizard.js
          test -s _site/shade-design.js
          test -s _site/shade-editor.js
          test -s _site/shade-editor.css
          test -s _site/mount-adapters.js
          test -s _site/basic-shade.js
          test -s _site/basic-options.js
          test -s _site/basic-shade.css
          test -s _site/workflow.css
          test -s _site/app.js
          test -s _site/styles.css
          test -s _site/assets/stands/wibble-stand.olmesh.gz
          test -s _site/assets/stands/wibble-reference.webp
          test -s _site/assets/shades/tallertop-original.olmesh.gz.part-18
          test -s _site/assets/stands/taller-stand.olmesh.gz
          test -s _site/assets/stands/taller-stand-reference.png
          ! grep -q 'src="/app.js"' _site/index.html
          ! grep -q 'href="/styles.css"' _site/index.html
          echo "Sitio estático listo para /OpenLamp-Studio/"

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Desplegar demo
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: openlamp-demo
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
