name: Validate develop
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check compatibility.js
          node --check wizard.js
      - name: Validate geometry and binary STL
        run: |
          node tests/verify.cjs
          node tests/taller_top.cjs
          node tests/original_top.cjs
          node tests/parametric_original.cjs
          node tests/compatibility.cjs
      - name: Validate optimized imported stand
        run: |
          node tests/stand.cjs
          node tests/taller_base.cjs
          node tests/assembly.cjs
      - name: Export sample parts
        run: |
          mkdir -p examples
          node tests/export.cjs
          test -s examples/cilindrica-pantalla.stl
          test -s examples/cilindrica-base.stl
